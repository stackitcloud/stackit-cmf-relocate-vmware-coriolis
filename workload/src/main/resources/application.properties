spring.application.name=relocate-demo
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/relocate
spring.datasource.username=relocate
spring.datasource.password=${RELOCATE_DB_PASSWORD}
spring.sql.init.mode=always
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
